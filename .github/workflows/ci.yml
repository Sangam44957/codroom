name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codroom_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/codroom_test
      JWT_SECRET: ci-test-secret-must-be-32-characters-long
      INTERNAL_SECRET: ci-test-internal-must-be-32-chars-long
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
      REDIS_URL: redis://localhost:6379
      GROQ_API_KEY: test-key
      BREVO_API_KEY: test-key
      BREVO_SENDER_EMAIL: test@example.com

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint || echo "⚠ Lint warnings found (non-blocking)"

      - name: Run unit tests
        run: npm test -- --coverage --testPathIgnorePatterns='smoke|e2e|roomJoin'

      - name: Run Socket.IO server tests
        run: npm test -- --testPathPatterns=socketLogic.test.js

      - name: Run component tests
        run: npm test -- --testPathPatterns=roomPageLogic.test.js

      - name: Run regex logic tests
        run: npm test -- --testPathPatterns=regexLogic.test.js

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: success()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codroom_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/codroom_test
      JWT_SECRET: ci-test-secret-must-be-32-characters-long
      INTERNAL_SECRET: ci-test-internal-must-be-32-chars-long
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
      REDIS_URL: redis://localhost:6379
      GROQ_API_KEY: test-key
      BREVO_API_KEY: test-key
      BREVO_SENDER_EMAIL: test@example.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application
        run: npm run build
